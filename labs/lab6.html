<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Data Types & Profit Calculator</title>
</head>
<body>
    
    
    <h1>Filtered Array</h1>
    <button onclick="displayFilteredArray()">Filter Array</button>
    <p id="filteredOutput"></p>
    
    <script>
       

        

        function filterArray() {
            let numbers = [10, 15, 20, 25, 30, 35, 40];
            return numbers.filter(num => num > 20);
        }

        function displayFilteredArray() {
            let filtered = filterArray();
            document.getElementById("filteredOutput").innerHTML = `Filtered Array: ${JSON.stringify(filtered)}`;
            console.log("Filtered Array:", filtered);
        }
    </script>
</body>
</html>
